name: CMS Phinit Lighthouse

'on':
  workflow_dispatch:
    inputs:
      baseUrl:
        description: 'Optionale Basis-URL der Preview/Staging-Site (überschreibt die Repo-Zieldatei)'
        required: false
        type: string
      homePath:
        description: 'Optionaler Pfad für die Startseite'
        required: false
        default: '/'
        type: string
      blogPath:
        description: 'Optionaler Pfad für das Blog-/Archivziel'
        required: false
        default: '/blog'
        type: string
      postPath:
        description: 'Optionaler Pfad für einen typischen Einzelbeitrag (überschreibt die Repo-Zieldatei)'
        required: false
        type: string
      memberSecurityPath:
        description: 'Optionaler Pfad für die Member-Security-Seite'
        required: false
        default: '/member/security'
        type: string
  pull_request:
    paths:
      - 'cms-phinit/**'
      - '.github/workflows/cms-phinit-lighthouse.yml'
  schedule:
    - cron: '17 4 * * 1'

concurrency:
  group: cms-phinit-lighthouse-${{ github.event.pull_request.number || github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  lighthouse:
    name: Lighthouse CI
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: LHCI-Zielpfade auflösen
        id: targets
        shell: bash
        env:
          INPUT_BASE_URL: ${{ github.event.inputs.baseUrl || '' }}
          INPUT_HOME_PATH: ${{ github.event.inputs.homePath || '' }}
          INPUT_BLOG_PATH: ${{ github.event.inputs.blogPath || '' }}
          INPUT_POST_PATH: ${{ github.event.inputs.postPath || '' }}
          INPUT_MEMBER_SECURITY_PATH: ${{ github.event.inputs.memberSecurityPath || '' }}
        run: |
          pick_first() {
            for value in "$@"; do
              if [ -n "$value" ]; then
                printf '%s' "$value"
                return 0
              fi
            done
            return 1
          }

          config_file='.github/cms-phinit-lighthouse-targets.json'
          config_base_url=''
          config_home_path=''
          config_blog_path=''
          config_post_path=''
          config_member_security_path=''

          if [ -f "$config_file" ]; then
            mapfile -t config_values < <(python3 -c "import json, pathlib; data = json.loads(pathlib.Path('$config_file').read_text(encoding='utf-8')); print(str(data.get('baseUrl', '') or '').strip()); print(str(data.get('homePath', '') or '').strip()); print(str(data.get('blogPath', '') or '').strip()); print(str(data.get('postPath', '') or '').strip()); print(str(data.get('memberSecurityPath', '') or '').strip())")

            config_base_url="${config_values[0]:-}"
            config_home_path="${config_values[1]:-}"
            config_blog_path="${config_values[2]:-}"
            config_post_path="${config_values[3]:-}"
            config_member_security_path="${config_values[4]:-}"
          fi

          base_url="$(pick_first "$INPUT_BASE_URL" "$config_base_url" || true)"
          post_path="$(pick_first "$INPUT_POST_PATH" "$config_post_path" || true)"
          home_path="$(pick_first "$INPUT_HOME_PATH" "$config_home_path" "/")"
          blog_path="$(pick_first "$INPUT_BLOG_PATH" "$config_blog_path" "/blog")"
          member_security_path="$(pick_first "$INPUT_MEMBER_SECURITY_PATH" "$config_member_security_path" "/member/security")"

          base_url="${base_url%/}"

          should_run=true
          skip_reason=''

          if [ -z "$base_url" ]; then
            should_run=false
            skip_reason='Es fehlt eine Preview-/Staging-Basis-URL. Setze den Workflow-Input `baseUrl` oder pflege `.github/cms-phinit-lighthouse-targets.json`.'
          elif ! printf '%s' "$base_url" | grep -Eq '^https?://'; then
            should_run=false
            skip_reason='Die konfigurierte Basis-URL muss mit http:// oder https:// beginnen.'
          elif [ -z "$post_path" ]; then
            should_run=false
            skip_reason='Es fehlt ein reproduzierbarer `postPath`. Setze den Workflow-Input `postPath` oder pflege `.github/cms-phinit-lighthouse-targets.json`.'
          fi

          {
            echo "should_run=$should_run"
            echo "base_url=$base_url"
            echo "home_path=$home_path"
            echo "blog_path=$blog_path"
            echo "post_path=$post_path"
            echo "member_security_path=$member_security_path"
            echo "skip_reason=$skip_reason"
          } >> "$GITHUB_OUTPUT"

      - name: Lighthouse CI installieren
        if: steps.targets.outputs.should_run == 'true'
        run: npm install -g @lhci/cli@0.15.x

      - name: Lighthouse-Zusammenfassung bei Skip
        if: steps.targets.outputs.should_run != 'true'
        shell: bash
        run: |
          {
            echo '## Lighthouse CI übersprungen'
            echo ''
            echo '${{ steps.targets.outputs.skip_reason }}'
            echo ''
            echo 'Für automatische PR-/Schedule-Läufe wird eine Repo-Datei `.github/cms-phinit-lighthouse-targets.json` oder ein manueller `workflow_dispatch`-Run mit `baseUrl` und `postPath` benötigt.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Lighthouse-Läufe ausführen
        if: steps.targets.outputs.should_run == 'true'
        env:
          LHCI_BASE_URL: ${{ steps.targets.outputs.base_url }}
          LHCI_HOME_PATH: ${{ steps.targets.outputs.home_path }}
          LHCI_BLOG_PATH: ${{ steps.targets.outputs.blog_path }}
          LHCI_POST_PATH: ${{ steps.targets.outputs.post_path }}
          LHCI_MEMBER_SECURITY_PATH: ${{ steps.targets.outputs.member_security_path }}
        run: lhci autorun --config=cms-phinit/lighthouserc.js

      - name: Lighthouse-Zusammenfassung schreiben
        if: always() && steps.targets.outputs.should_run == 'true'
        shell: bash
        run: |
          {
            echo '## Lighthouse CI ausgeführt'
            echo ''
            echo '- Basis-URL: `${{ steps.targets.outputs.base_url }}`'
            echo '- Startseite: `${{ steps.targets.outputs.home_path }}`'
            echo '- Blog/Archiv: `${{ steps.targets.outputs.blog_path }}`'
            echo '- Einzelbeitrag: `${{ steps.targets.outputs.post_path }}`'
            echo '- Member-Security: `${{ steps.targets.outputs.member_security_path }}`'
            echo ''
            echo 'Die vollständigen LHCI-Artefakte liegen im Workflow-Artefakt `cms-phinit-lighthouse-report`.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: LHCI-Artefakte hochladen
        if: always() && steps.targets.outputs.should_run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: cms-phinit-lighthouse-report
          path: .lighthouseci
          if-no-files-found: warn